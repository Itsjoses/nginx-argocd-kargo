apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: nginx-warehouse
  namespace: nginx-kargo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  subscriptions:
    - image:
        repoURL: harbor.cluster.com/library/nginx
    - git:
        repoURL: https://github.com/Itsjoses/nginx-argocd-kargo.git
