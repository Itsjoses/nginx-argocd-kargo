# Ganti YOUR_ORG/YOUR_REPO — repoURL harus sama di template.spec.source.
# Tambah app di list project; tambah env di list env (matrix = cartesian product).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-from-overlays
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - app: nginx
          - list:
              elements:
                - env: dev
                  namespace: nginx-kargo-dev
                - env: staging
                  namespace: nginx-kargo-staging             
                - env: prod
                  namespace: nginx-kargo-prod
  template:
    metadata:
      # nginx + dev -> nginx-dev
      name: "{{ .app }}-{{ .env }}"
      annotations:
        kargo.akuity.io/authorized-stage: "nginx-kargo:{{ .app }}-{{ .env }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/Itsjoses/nginx-argocd-kargo.git
        targetRevision: HEAD
        path: "{{ .app }}/overlays/{{ .env }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
